name: "C++ CI Release Build"

on:
  push:
    branches:
      - tasks/*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure CMake
        run: cmake -B build -DPATCH_VERSION=${{ github.run_number }} -DWITH_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target package

      - name: Verify installed library (external linking smoke test)
        run: |
          cmake --install build --prefix /tmp/otus-stage
          cd /tmp && rm -f bulk*.log
          g++ -std=c++23 -Wall -Wextra -pedantic -Werror \
            -I/tmp/otus-stage/include "$GITHUB_WORKSPACE/examples/external_async/main.cpp" \
            -L/tmp/otus-stage/lib -lasync -Wl,-rpath,/tmp/otus-stage/lib -o external_async
          ./external_async > ext.out
          printf 'bulk: 1, 2, 3, 4, 5\nbulk: 6\nbulk: a, b, c, d\nbulk: 89\nbulk: 1\n' > ext.expected
          diff ext.out ext.expected
          test "$(ls bulk*.log | wc -l)" -eq 5

      - name: Smoke test bulk_server (network scenario)
        run: |
          cd /tmp && rm -f bulk*.log
          "$GITHUB_WORKSPACE/build/bulk_server" 19013 3 > srv.log 2>&1 &
          SRV=$!
          sleep 1
          python3 - <<'PY'
          import socket, time
          for _ in range(100):
              try:
                  s = socket.create_connection(("127.0.0.1", 19013), timeout=1)
                  break
              except OSError:
                  time.sleep(0.05)
          else:
              raise SystemExit("no connection")
          s.sendall(b"".join(f"{i}\n".encode() for i in range(10)))
          s.shutdown(socket.SHUT_WR)
          s.close()
          PY
          sleep 1
          kill -TERM $SRV
          wait $SRV
          printf 'bulk: 0, 1, 2\nbulk: 3, 4, 5\nbulk: 6, 7, 8\nbulk: 9\n' > expected.txt
          diff srv.log expected.txt
          test "$(ls bulk*.log | wc -l)" -eq 4

      - name: Get Package Filename
        id: package
        run: echo "deb=$(find build -name '*.deb' -exec basename {} \; | tail -n 1)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: Release v0.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: ./${{ steps.package.outputs.deb }}
